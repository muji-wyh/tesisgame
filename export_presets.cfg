[preset.0]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="words.json,assets/chests/manifest.json,assets/chests/rigs.json,assets/chests/downloaded/manifest.json"
exclude_filter="tests/*,tools/*,docs/*,node_modules/*,build/*,web/*,test-results/*,playwright-report/*,index.html,package*.json,*.md,*.cjs,*.ps1,*.txt,assets/fonts/Nunito-600.ttf,assets/fonts/Nunito-800.ttf,assets/images/mascots/outfits/wardrobe.svg,assets/audio/voice/spring-arrive.wav,assets/audio/voice/summer-arrive.wav,assets/audio/voice/autumn-arrive.wav,assets/audio/voice/winter-arrive.wav,assets/audio/voice/ocean-arrive.wav,assets/audio/voice/space-arrive.wav,assets/audio/voice/jungle-arrive.wav,assets/audio/voice/candy-arrive.wav,assets/audio/voice/spring-open.wav,assets/audio/voice/summer-open.wav,assets/audio/voice/autumn-open.wav,assets/audio/voice/winter-open.wav,assets/audio/voice/ocean-open.wav,assets/audio/voice/space-open.wav,assets/audio/voice/jungle-open.wav,assets/audio/voice/candy-open.wav,assets/audio/pop/*,assets/talk_quest/*,assets/audio/quest/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=0
html/focus_canvas_on_start=false
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
