<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Word Buddies</title>
  <style id="game-style">
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      height: 100vh;
      height: 100dvh;
      overscroll-behavior: none;
      color: #35415e;
      background: #fff7e9;
      font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button, select { font: inherit; color: inherit; touch-action: manipulation; }
    button { cursor: pointer; }
    button:disabled, select:disabled { cursor: default; }
    :is(button, select):focus-visible { outline: 4px solid #435dad; outline-offset: -5px; }
    h1, h2, p { margin: 0; }
    [data-theme="spring"] {
      --bg: #eff9ed; --accent: #568969; --chest: #88c99f; --edge: #517c65; --trim: #f6b8ce;
    }
    [data-theme="summer"] {
      --bg: #eafaff; --accent: #367f9c; --chest: #69c8dc; --edge: #367f9c; --trim: #ffdd75;
    }
    [data-theme="autumn"] {
      --bg: #fff1dd; --accent: #9d6140; --chest: #d9995e; --edge: #9d6140; --trim: #f7d078;
    }
    [data-theme="winter"] {
      --bg: #eef4ff; --accent: #627fa4; --chest: #a9cee9; --edge: #688faa; --trim: #f5fbff;
    }
    #app {
      height: 100%;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(4px, 1.2vh, 14px);
      padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      background: var(--bg, #fff7e9);
    }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: 4px;
    }
    h1 { font-size: clamp(16px, 3vmin, 28px); line-height: 1.1; }
    .tool, #theme, .replay {
      min-width: 48px;
      min-height: 48px;
      padding: 4px 6px;
      border: 2px solid #d9dbe7;
      border-radius: 14px;
      background: #fff;
      font-weight: 700;
    }
    .tool { font-size: 14px; }
    #theme { width: 94px; font-size: 14px; }
    #screens { display: grid; min-height: 0; min-width: 0; }
    .screen { min-height: 0; min-width: 0; }
    #loading-screen {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 12px;
      text-align: center;
    }
    #load-message { overflow-wrap: anywhere; }
    #round-screen {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 6px;
    }
    .scores {
      display: flex;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
    }
    .scores span { padding: 3px 10px; background: #fff; border-radius: 12px; }
    #board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: clamp(6px, 2vmin, 18px);
      min-height: 0;
      width: 100%;
      max-width: 1050px;
      justify-self: center;
    }
    .card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      place-items: center;
      min-width: 0;
      min-height: 0;
      border: 3px solid #e0dfeb;
      border-radius: 24px;
      background: #fff;
      padding: clamp(4px, 1vmin, 14px);
      font-size: clamp(30px, 9vmin, 68px);
      font-weight: 800;
      line-height: 1;
      box-shadow: 0 4px 0 #ddd8cb;
    }
    .card img {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 200px;
      max-height: 200px;
      object-fit: contain;
    }
    .card.is-selected { border-color: var(--accent); background: var(--bg); }
    .card.is-matched { border-color: #72b997; background: #edf8f1; box-shadow: none; }
    .card.is-matched > :first-child { opacity: .4; }
    .card.is-wrong { border-color: #e3998f; background: #fff0e9; animation: wobble .35s; }
    .marker { position: absolute; right: 6px; top: 5px; font-size: 22px; color: #347354; }
    .is-wrong .marker { color: #a45047; }
    #feedback { min-height: 2.2em; font-size: clamp(14px, 2.4vmin, 22px); text-align: center; }
    .result {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 6px;
      justify-items: center;
      text-align: center;
    }
    .result h2 { font-size: clamp(20px, 4vmin, 36px); }
    .result p { font-size: clamp(14px, 2.3vmin, 21px); }
    .stage {
      display: grid;
      place-items: center;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      isolation: isolate;
    }
    #chest-button {
      position: relative;
      width: min(75vw, 320px);
      height: 94%;
      min-height: 48px;
      max-height: 300px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      padding: 0;
      z-index: 1;
    }
    .chest-body, .chest-lid {
      position: absolute;
      left: 10%;
      width: 80%;
      border: 5px solid var(--edge);
      background: linear-gradient(90deg, transparent 10%, var(--trim) 10% 18%,
        transparent 18% 82%, var(--trim) 82% 90%, transparent 90%), var(--chest);
    }
    .chest-body { top: 47%; height: 40%; border-radius: 0 0 17px 17px; }
    .chest-lid { top: 20%; height: 30%; border-radius: 25px 25px 5px 5px; transform-origin: 50% 0; }
    .chest-lock {
      position: absolute;
      left: 44%;
      top: 43%;
      width: 12%;
      height: 17%;
      border-radius: 5px;
      background: var(--trim);
    }
    #chest-symbol { position: absolute; left: 41%; top: 62%; width: 18%; height: 20%; object-fit: contain; }
    /* Keep the tap target stationary while its artwork floats. */
    #app[data-chest="closed"] #chest-button > * { animation: float 2.4s ease-in-out infinite; }
    #app:is([data-chest="opening"], [data-chest="opened"]) .chest-lid {
      transform: translateY(-55%) rotate(-8deg);
    }
    #app[data-chest="opening"] #chest-button { animation: chest-charge var(--open-duration) both; }
    #app[data-chest="opening"] .chest-lock { animation: lock-charge .5s both; }
    #app[data-chest="opening"] #chest-button[data-theme="spring"] .chest-lid { animation: spring-open var(--open-duration) both; }
    #app[data-chest="opening"] #chest-button[data-theme="summer"] .chest-lid { animation: summer-open var(--open-duration) both; }
    #app[data-chest="opening"] #chest-button[data-theme="autumn"] .chest-lid { animation: autumn-open var(--open-duration) both; }
    #app[data-chest="opening"] #chest-button[data-theme="winter"] .chest-lid { animation: winter-open var(--open-duration) both; }
    #effects { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 2; }
    .fx-vignette {
      position: absolute; left: 50%; top: 56%;
      width: var(--fx-span); height: var(--fx-span); border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(32, 34, 78, .2), rgba(32, 34, 78, .08) 48%, transparent 72%);
      animation: fx-fade var(--fx-duration) both;
    }
    .fx-aura, .fx-rays, .fx-ring {
      position: absolute; left: 50%; top: 56%;
      width: var(--fx-span); height: var(--fx-span);
      transform: translate(-50%, -50%); border-radius: 50%;
    }
    .fx-aura {
      background: radial-gradient(circle, #fff9d8 0%, rgba(var(--fx-rgb), .8) 18%, rgba(var(--fx-rgb), .3) 42%, transparent 70%);
      animation: fx-aura var(--fx-duration) both;
    }
    .fx-rays {
      background: repeating-conic-gradient(from 12deg, transparent 0deg 13deg, rgba(var(--fx-rgb), .6) 14deg 22deg, transparent 23deg 36deg);
      -webkit-mask-image: radial-gradient(circle, #000 8%, transparent 70%);
      mask-image: radial-gradient(circle, #000 8%, transparent 70%);
      animation: fx-rays var(--fx-duration) both;
    }
    #effects[data-theme="winter"] .fx-rays {
      background: repeating-conic-gradient(from 8deg, transparent 0deg 15deg, #bbcaffaa 16deg 20deg, #c4fffbaa 21deg 26deg, transparent 27deg 45deg);
    }
    .fx-beam {
      position: absolute; left: 50%; bottom: 42%;
      width: var(--fx-span); height: var(--fx-span);
      background: linear-gradient(to top, #fff5c5ee, rgba(var(--fx-rgb), .58), transparent);
      clip-path: polygon(40% 100%, 60% 100%, 100% 0, 0 0);
      transform-origin: 50% 100%;
      animation: fx-beam 2.2s .28s both;
    }
    .fx-ring {
      border: 3px solid #fff6d4;
      box-shadow: 0 0 18px rgba(var(--fx-rgb), .7), inset 0 0 16px rgba(var(--fx-rgb), .45);
      animation: fx-ring 1.3s .34s both;
    }
    .fx-ring.ring-second { border-width: 1px; animation-delay: .53s; animation-duration: 1.5s; }
    .fx-cheer {
      position: absolute; left: 50%; top: 8%; color: #fffdf4;
      font-size: clamp(24px, 6vmin, 58px); font-weight: 900; line-height: 1.1;
      text-shadow: 0 2px 0 #b18055, 0 4px 16px rgba(95, 53, 95, .28);
      animation: fx-cheer 1s .55s both;
    }
    .fx-particle {
      position: absolute;
      left: 50%; top: 56%; width: var(--size); height: var(--size);
      color: var(--fx-color);
      animation: fx-particle var(--duration) var(--delay) ease-out both;
      will-change: transform, opacity;
    }
    .fx-particle img { display: block; width: 100%; height: 100%; }
    .fx-token { filter: drop-shadow(0 0 5px var(--fx-color)); }
    .fx-spark, .fx-confetti { background: var(--fx-color); border-radius: 50%; }
    .fx-spark { box-shadow: 0 0 8px var(--fx-color); }
    .fx-spark:nth-child(even) {
      border-radius: 0;
      clip-path: polygon(50% 0, 62% 35%, 100% 50%, 62% 65%, 50% 100%, 38% 65%, 0 50%, 38% 35%);
    }
    #effects[data-theme="spring"] .fx-confetti { border-radius: 80% 12% 80% 12%; }
    #effects[data-theme="summer"] .fx-confetti { border: 2px solid #ffffffb0; background: #a1e7ff66; box-shadow: inset 2px 2px 0 #ffffffb0; }
    #effects[data-theme="autumn"] .fx-confetti { clip-path: polygon(50% 0, 67% 28%, 100% 15%, 85% 55%, 100% 80%, 60% 83%, 50% 100%, 40% 83%, 0 80%, 15% 55%, 0 15%, 33% 28%); border-radius: 0; }
    #effects[data-theme="winter"] .fx-confetti { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); border-radius: 0; }
    #reward {
      position: absolute;
      top: 16%;
      left: 50%;
      z-index: 3;
      display: grid;
      justify-items: center;
      gap: 6px;
      max-width: 92%;
      width: max-content;
      padding: 10px 20px;
      border: 2px solid #fffdf0;
      border-radius: 24px;
      background: linear-gradient(145deg, #fffef5, #ffebaa);
      box-shadow: 0 8px 28px #63462a30, inset 0 0 0 3px #ffffffa0;
      font-weight: 800;
      font-size: clamp(16px, 2.8vmin, 26px);
      transform: translateX(-50%);
    }
    #reward img { width: clamp(36px, 14vmin, 100px); height: clamp(36px, 14vmin, 100px); object-fit: contain; }
    #app[data-chest="opened"] #reward { animation: reward-pop .7s cubic-bezier(.16, 1.15, .3, 1) both; }
    #loss-art { width: 100%; height: 100%; max-width: 260px; max-height: 260px; object-fit: contain; }
    .replay { min-width: 130px; font-size: 18px; background: #fff3c7; }
    #audio-status { min-height: 1.2em; font-size: 12px; text-align: center; overflow-wrap: anywhere; }
    @media (min-aspect-ratio: 1/1) {
      #board {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-height: 480px) {
      #app { gap: 4px; }
      #round-screen { gap: 4px; }
      #board {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }
      .card { border-radius: 15px; font-size: clamp(16px, 4vw, 34px); }
      .result h2 { font-size: 20px; }
      .result { gap: 4px; }
      #reward { top: 8%; padding: 4px 10px; gap: 2px; border-radius: 14px; }
      #reward img { width: 32px; height: 32px; }
    }
    @keyframes float { 50% { transform: translateY(-4px); } }
    @keyframes wobble { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
    @keyframes spring-open {
      0%, 20% { transform: none; }
      45% { transform: translateY(-68%) rotate(12deg); }
      70%, 100% { transform: translateY(-55%) rotate(-8deg); }
    }
    @keyframes summer-open {
      0%, 20% { transform: none; }
      42% { transform: translateY(-95%) rotate(-4deg); }
      66%, 100% { transform: translateY(-55%) rotate(-8deg); }
    }
    @keyframes autumn-open {
      0%, 20% { transform: none; }
      48% { transform: translateY(-40%) rotate(-20deg); }
      75%, 100% { transform: translateY(-55%) rotate(-8deg); }
    }
    @keyframes winter-open {
      0%, 20% { transform: none; }
      75%, 100% { transform: translateY(-55%) rotate(-8deg); }
    }
    @keyframes chest-charge {
      0%, 100% { transform: none; }
      10% { transform: scale(.96) rotate(-1deg); }
      18% { transform: scale(.98) rotate(1deg); }
      30% { transform: scale(1.035) translateY(-2px); }
      55% { transform: scale(1); }
    }
    @keyframes lock-charge { 55% { transform: scale(1.25); } to { opacity: 0; transform: scale(.5); } }
    @keyframes fx-fade { 0%, 100% { opacity: 0; } 15%, 60% { opacity: 1; } }
    @keyframes fx-aura {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.25); }
      18% { opacity: .95; transform: translate(-50%, -50%) scale(1.1); }
      65% { opacity: .5; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }
    @keyframes fx-rays {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-18deg) scale(.2); }
      18% { opacity: .9; }
      65% { opacity: .4; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(28deg) scale(1.35); }
    }
    @keyframes fx-beam {
      from { opacity: 0; transform: translateX(-50%) scaleY(.1); }
      20%, 45% { opacity: .8; transform: translateX(-50%) scaleY(1); }
      to { opacity: 0; transform: translateX(-50%) scaleY(1.15); }
    }
    @keyframes fx-ring {
      from { opacity: .9; transform: translate(-50%, -50%) scale(.08); }
      to { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
    }
    @keyframes fx-cheer {
      from { opacity: 0; transform: translateX(-50%) scale(.5) rotate(-10deg); }
      30%, 65% { opacity: 1; transform: translateX(-50%) scale(1.1) rotate(-5deg); }
      to { opacity: 0; transform: translate(-50%, -25px) scale(1); }
    }
    @keyframes fx-particle {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.08); }
      12% { opacity: 1; }
      46% { opacity: 1; transform: translate(-50%, -50%) translate(var(--mid-x), var(--mid-y)) scale(1) rotate(90deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--end-x), var(--end-y)) scale(.6) rotate(var(--spin)); }
    }
    @keyframes reward-pop {
      from { opacity: 0; transform: translate(-50%, 24px) scale(.5); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #effects { display: none; }
    }
  </style>
</head>
<body>
<main id="app" aria-label="Word Buddies" data-phase="loading">
  <header>
    <h1>Word Buddies</h1>
    <select id="theme" aria-label="Theme" disabled></select>
    <button id="mute" class="tool" type="button" aria-pressed="false" disabled>Mute</button>
    <button id="listen" class="tool" type="button" aria-label="Listen again" disabled>Listen</button>
  </header>
  <div id="screens">
    <section id="loading-screen" class="screen">
      <h2>Getting ready</h2>
      <p id="load-message" role="status">Loading words and pictures...</p>
      <button id="retry" class="replay" type="button" hidden>Retry</button>
    </section>
    <section id="round-screen" class="screen" aria-label="Matching game" hidden>
      <div class="scores">
        <span>Matches <b id="success-count">0</b>/3</span>
        <span>Oops <b id="error-count">0</b>/3</span>
      </div>
      <div id="board" aria-label="Word and picture cards"></div>
      <p id="feedback" role="status" aria-live="polite"></p>
    </section>
    <section id="win-screen" class="screen result" aria-labelledby="win-title" hidden>
      <h2 id="win-title" tabindex="-1">You did it!</h2>
      <p id="win-hint"></p>
      <div class="stage">
        <div id="effects" aria-hidden="true"></div>
        <button id="chest-button" type="button">
          <span class="chest-body" aria-hidden="true"></span>
          <span class="chest-lid" aria-hidden="true"></span>
          <span class="chest-lock" aria-hidden="true"></span>
          <img id="chest-symbol" alt="">
        </button>
        <div id="reward" role="status" tabindex="-1" hidden>
          <img id="reward-image" alt="">
          <span id="reward-label"></span>
        </div>
      </div>
      <button id="win-replay" class="replay" type="button">Play again</button>
    </section>
    <section id="loss-screen" class="screen result" aria-labelledby="loss-title" hidden>
      <h2 id="loss-title" tabindex="-1">Good try!</h2>
      <p>Let's play again!</p>
      <div class="stage">
        <img id="loss-art" src="assets/images/scenes/try-again.svg" alt="A friendly bear ready to try again">
      </div>
      <button id="loss-replay" class="replay" type="button">Play again</button>
    </section>
  </div>
  <p id="audio-status" role="status" aria-live="polite"></p>
</main>
<script id="game-core">
(() => {
  const SEASONS = Object.freeze([
    { id: 'spring', name: 'Spring', prize: 'flower' },
    { id: 'summer', name: 'Summer', prize: 'sun' },
    { id: 'autumn', name: 'Autumn', prize: 'leaf' },
    { id: 'winter', name: 'Winter', prize: 'snowflake' }
  ].map((theme) => Object.freeze({
    ...theme,
    bgm: `assets/audio/bgm/${theme.id}.wav`,
    symbol: `assets/images/rewards/${theme.id}.svg`
  })));

  function validateWords(input) {
    if (!Array.isArray(input) || input.length < 5) {
      throw new TypeError('At least five words are required for three pairs and two extra cards.');
    }
    const ids = new Set();
    const texts = new Set();
    const images = new Set();
    return Object.freeze(input.map((word) => {
      if (!word || typeof word !== 'object' ||
        ['id', 'text', 'image', 'audio'].some((key) => typeof word[key] !== 'string') ||
        !/^[a-z][a-z0-9-]{1,19}$/.test(word.id) ||
        !/^[a-z]{2,6}$/.test(word.text) ||
        !/^assets\/images\/words\/[a-z0-9-]+\.(svg|png|webp)$/.test(word.image) ||
        !/^assets\/audio\/voice\/[a-z0-9-]+\.wav$/.test(word.audio) ||
        ids.has(word.id) || texts.has(word.text) || images.has(word.image)) {
        throw new TypeError('Each word needs a unique ID, short English text, local image and voice URL.');
      }
      ids.add(word.id);
      texts.add(word.text);
      images.add(word.image);
      return Object.freeze({ id: word.id, text: word.text, image: word.image, audio: word.audio });
    }));
  }

  function randomIndex(length, rng) {
    const value = rng();
    if (!Number.isFinite(value) || value < 0 || value >= 1) {
      throw new RangeError('Random value must be in [0, 1).');
    }
    return Math.floor(value * length);
  }

  function shuffle(input, rng = Math.random) {
    const result = [...input];
    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = randomIndex(i + 1, rng);
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function chooseSeason(rng = Math.random) {
    return SEASONS[randomIndex(SEASONS.length, rng)];
  }

  function createRound(input, rng = Math.random) {
    const words = shuffle(validateWords(input), rng);
    const card = (word, kind) => ({ id: `${word.id}:${kind}`, wordId: word.id, kind });
    const cards = shuffle([
      ...words.slice(0, 3).flatMap((word) => ['word', 'image'].map((kind) => card(word, kind))),
      card(words[3], 'word'),
      card(words[4], 'image')
    ], rng);
    return {
      phase: 'waiting', cards, selected: null, matched: [],
      successes: 0, errors: 0, feedback: null, theme: chooseSeason(rng).id
    };
  }

  function chooseCard(state, cardId) {
    if (!['waiting', 'matching'].includes(state.phase)) return state;
    const card = state.cards.find((item) => item.id === cardId);
    if (!card) throw new RangeError(`Unknown card: ${cardId}`);
    if (state.matched.includes(card.wordId)) return state;
    if (state.selected === cardId) return { ...state, phase: 'waiting', selected: null };
    const first = state.cards.find((item) => item.id === state.selected);
    if (!first || first.kind === card.kind) {
      return { ...state, phase: 'matching', selected: cardId };
    }
    const correct = first.wordId === card.wordId;
    return {
      ...state, phase: 'feedback', selected: null,
      successes: state.successes + Number(correct),
      errors: state.errors + Number(!correct),
      matched: correct ? [...state.matched, card.wordId] : state.matched,
      feedback: { correct, cardIds: [first.id, card.id] }
    };
  }

  function finishFeedback(state) {
    if (state.phase !== 'feedback') return state;
    const phase = state.successes === 3 ? 'won' : state.errors === 3 ? 'lost' : 'waiting';
    return { ...state, phase, selected: null, feedback: null };
  }

  function setTheme(state, id) {
    if (!SEASONS.some((theme) => theme.id === id)) throw new RangeError(`Unknown theme: ${id}`);
    return state.theme === id ? state : { ...state, theme: id };
  }

  globalThis.GameCore = Object.freeze({
    SEASONS, validateWords, shuffle, chooseSeason, createRound, chooseCard, finishFeedback, setTheme
  });
})();
</script>
<script id="game-effects">
(() => {
  const OPEN_MS = 1800;
  const EFFECT_MS = 4800;
  const COUNT = 72;
  const running = new WeakMap();
  const THEMES = {
    spring: { colors: ['#ffc2df', '#a4e1b7', '#ffe6a1'], rgb: '255, 182, 219', lift: -0.6, spin: 240 },
    summer: { colors: ['#ffcf62', '#9aeeff', '#fff7c2'], rgb: '255, 215, 107', lift: -0.9, spin: 150 },
    autumn: { colors: ['#ffb260', '#e88966', '#ffdf98'], rgb: '255, 174, 89', lift: 0.8, spin: 600 },
    winter: { colors: ['#bbdfff', '#d1c6ff', '#fcfcff'], rgb: '172, 202, 255', lift: 0.55, spin: 120 }
  };

  function createParticles(id, random = Math.random) {
    const theme = THEMES[id];
    if (!theme) throw new RangeError(`Unknown effect theme: ${id}`);
    const draw = () => {
      const value = random();
      if (!Number.isFinite(value) || value < 0 || value >= 1) {
        throw new RangeError('Effect random values must be in [0, 1).');
      }
      return value;
    };
    return Array.from({ length: COUNT }, (_, i) => {
      const kind = i < 12 ? 'token' : i < 48 ? 'spark' : 'confetti';
      const localIndex = kind === 'token' ? i : kind === 'spark' ? i - 12 : i - 48;
      const groupSize = kind === 'token' ? 12 : kind === 'spark' ? 36 : 24;
      const angle = (localIndex / groupSize + draw() * 0.08) * Math.PI * 2;
      const distance = 0.45 + draw() * 0.55;
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance * 0.72;
      return {
        kind, x, y,
        endX: x + (draw() - 0.5) * 0.45,
        endY: y + theme.lift * (0.4 + draw() * 0.6),
        size: kind === 'token' ? 24 + draw() * 16 : kind === 'spark' ? 3 + draw() * 7 : 8 + draw() * 12,
        spin: (draw() < 0.5 ? -1 : 1) * (90 + draw() * theme.spin),
        delay: 360 + draw() * 260,
        duration: 1900 + draw() * 1100,
        color: theme.colors[i % theme.colors.length]
      };
    });
  }

  function play(container, season, { reduced = false } = {}) {
    const particles = createParticles(season.id);
    running.get(container)?.();
    let active = true;
    let timer = null;
    function stop() {
      if (!active) return;
      active = false;
      if (timer !== null) clearTimeout(timer);
      container.replaceChildren();
      delete container.dataset.active;
      delete container.dataset.theme;
      container.style.removeProperty('--fx-rgb');
      container.style.removeProperty('--fx-span');
      container.style.removeProperty('--fx-duration');
      if (running.get(container) === stop) running.delete(container);
    }
    running.set(container, stop);
    container.replaceChildren();
    if (reduced) return stop;
    const bounds = container.getBoundingClientRect();
    const reach = Math.max(44, Math.min(bounds.width * 0.42, bounds.height * 0.7, 260));
    container.dataset.active = 'true';
    container.dataset.theme = season.id;
    container.style.setProperty('--fx-rgb', THEMES[season.id].rgb);
    container.style.setProperty('--fx-span', `${reach * 2}px`);
    container.style.setProperty('--fx-duration', `${EFFECT_MS}ms`);
    for (const name of ['vignette', 'aura', 'rays', 'beam', 'ring ring-first', 'ring ring-second']) {
      const layer = document.createElement('span');
      layer.className = `fx-${name}`;
      container.append(layer);
    }
    const cheer = document.createElement('span');
    cheer.className = 'fx-cheer';
    cheer.textContent = 'Wow!';
    container.append(cheer);
    for (const particle of particles) {
      const element = document.createElement('span');
      element.className = `fx-particle fx-${particle.kind}`;
      const styles = {
        '--mid-x': `${particle.x * reach}px`,
        '--mid-y': `${particle.y * reach}px`,
        '--end-x': `${particle.endX * reach}px`,
        '--end-y': `${particle.endY * reach}px`,
        '--size': `${particle.size}px`,
        '--spin': `${particle.spin}deg`,
        '--delay': `${particle.delay}ms`,
        '--duration': `${particle.duration}ms`,
        '--fx-color': particle.color
      };
      for (const [key, value] of Object.entries(styles)) element.style.setProperty(key, value);
      if (particle.kind === 'token') {
        const image = document.createElement('img');
        image.src = season.symbol;
        image.alt = '';
        element.append(image);
      }
      container.append(element);
    }
    timer = setTimeout(stop, EFFECT_MS);
    return stop;
  }

  globalThis.GameEffects = Object.freeze({ OPEN_MS, EFFECT_MS, COUNT, createParticles, play });
})();
</script>
<script id="game-app">
(() => {
  const core = GameCore;
  const byId = (id) => document.getElementById(id);
  const app = byId('app');
  const board = byId('board');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const timers = new Set();
  let words = [];
  let state;
  let generation = 0;
  let chest = 'closed';
  let rewardTheme = null;
  let muted = false;
  let stopEffects = null;
  app.style.setProperty('--open-duration', `${GameEffects.OPEN_MS}ms`);

  function cue(type, detail = {}) {
    window.dispatchEvent(new CustomEvent('game:audio', { detail: { type, ...detail } }));
  }

  function theme(id) {
    const result = core.SEASONS.find((item) => item.id === id);
    if (!result) throw new RangeError(`Unknown theme: ${id}`);
    return result;
  }

  function clearTimers() {
    generation += 1;
    for (const timer of timers) clearTimeout(timer);
    timers.clear();
  }

  function later(callback, delay) {
    const current = generation;
    const timer = setTimeout(() => {
      timers.delete(timer);
      if (current === generation) callback();
    }, delay);
    timers.add(timer);
  }

  function setImage(image, source) {
    if (image.getAttribute('src') !== source) image.src = source;
  }

  function clearEffects() {
    stopEffects?.();
    stopEffects = null;
  }

  function render() {
    app.dataset.phase = state.phase;
    app.dataset.theme = state.theme;
    app.dataset.chest = chest;
    byId('loading-screen').hidden = true;
    byId('round-screen').hidden = ['won', 'lost'].includes(state.phase);
    byId('win-screen').hidden = state.phase !== 'won';
    byId('loss-screen').hidden = state.phase !== 'lost';
    byId('theme').value = state.theme;
    byId('theme').disabled = chest === 'opening';
    byId('mute').disabled = false;
    byId('listen').disabled = false;
    byId('success-count').textContent = String(state.successes);
    byId('error-count').textContent = String(state.errors);

    for (const button of board.children) {
      const matched = state.matched.includes(button.dataset.wordId);
      const wrong = Boolean(
        state.feedback?.cardIds.includes(button.dataset.cardId) && !state.feedback.correct
      );
      button.disabled = matched || !['waiting', 'matching'].includes(state.phase);
      button.classList.toggle('is-selected', state.selected === button.dataset.cardId);
      button.classList.toggle('is-matched', matched);
      button.classList.toggle('is-wrong', wrong);
      button.setAttribute('aria-pressed', String(state.selected === button.dataset.cardId));
      button.querySelector('.marker').textContent = matched ? '\u2713' : wrong ? '\u00d7' : '';
    }

    byId('feedback').textContent = state.phase === 'waiting' ? 'Find 3 pairs. Watch for extra cards!' :
      state.phase === 'matching' ? 'Find its friend!' :
      state.phase === 'feedback' ? (state.feedback.correct ? 'Great match!' : 'Try another friend!') : '';
    byId('chest-button').disabled = state.phase !== 'won' || chest !== 'closed';
    if (state.phase === 'won') {
      const season = theme(rewardTheme || state.theme);
      byId('chest-button').dataset.theme = season.id;
      byId('chest-button').setAttribute('aria-label', `Open the ${season.name} chest`);
      setImage(byId('chest-symbol'), season.symbol);
      byId('win-hint').textContent = chest === 'closed' ? `Tap the ${season.name} chest!` :
        chest === 'opening' ? 'Opening your surprise...' : 'A gift for you!';
    }
  }

  function startRound(focus = false) {
    clearTimers();
    state = core.createRound(words);
    chest = 'closed';
    rewardTheme = null;
    cue('reset', { theme: state.theme });
    clearEffects();
    byId('reward').hidden = true;
    byId('reward-image').removeAttribute('src');
    byId('reward-label').textContent = '';
    board.replaceChildren();

    for (const card of state.cards) {
      const word = words.find((item) => item.id === card.wordId);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'card';
      button.dataset.cardId = card.id;
      button.dataset.wordId = card.wordId;
      button.dataset.kind = card.kind;
      button.setAttribute('aria-label', card.kind === 'word' ? word.text : `Picture of ${word.text}`);
      const content = document.createElement(card.kind === 'word' ? 'span' : 'img');
      if (card.kind === 'word') {
        content.textContent = word.text;
      } else {
        content.src = word.image;
        content.alt = '';
        content.draggable = false;
      }
      const marker = document.createElement('span');
      marker.className = 'marker';
      marker.setAttribute('aria-hidden', 'true');
      button.append(content, marker);
      board.append(button);
    }

    render();
    if (focus) board.querySelector('button').focus();
  }

  function finishTurn() {
    state = core.finishFeedback(state);
    render();
    if (state.phase === 'won') {
      cue('win', { theme: state.theme });
      byId('win-title').focus();
    } else if (state.phase === 'lost') {
      cue('loss');
      byId('loss-title').focus();
    } else {
      board.querySelector('button:not(:disabled)')?.focus();
    }
  }

  function preload(source) {
    const image = new Image();
    image.src = source;
    return image.decode();
  }

  async function readWords() {
    if (location.protocol === 'file:') {
      throw new Error('Open this game through the local HTTP server.');
    }
    const response = await fetch('words.json', { cache: 'no-store' });
    if (!response.ok) throw new Error(`Vocabulary request failed (${response.status}).`);
    const result = core.validateWords(await response.json());
    const pictures = [
      ...result.map((word) => word.image),
      ...core.SEASONS.map((season) => season.symbol),
      'assets/images/scenes/try-again.svg'
    ];
    await Promise.all(pictures.map(preload));
    return result;
  }

  function boot() {
    clearTimers();
    cue('reset', { theme: null });
    app.dataset.phase = 'loading';
    byId('retry').hidden = true;
    byId('loading-screen').hidden = false;
    for (const id of ['round-screen', 'win-screen', 'loss-screen']) byId(id).hidden = true;
    for (const id of ['theme', 'mute', 'listen']) byId(id).disabled = true;
    byId('load-message').textContent = 'Loading words and pictures...';
    readWords().then((loaded) => {
      words = loaded;
      startRound();
    }, (error) => {
      console.error('Vocabulary or image loading failed.', error);
      app.dataset.phase = 'error';
      byId('load-message').textContent = 'Could not load words or pictures. Check the files and server, then tap Retry.';
      byId('retry').hidden = false;
    });
  }

  for (const season of core.SEASONS) {
    const option = document.createElement('option');
    option.value = season.id;
    option.textContent = season.name;
    byId('theme').append(option);
  }

  board.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-card-id]');
    if (!button || !board.contains(button) || button.disabled) return;
    const next = core.chooseCard(state, button.dataset.cardId);
    if (next === state) return;
    state = next;
    render();
    if (state.phase === 'matching') {
      const selected = state.cards.find((card) => card.id === state.selected);
      cue('select', { voice: words.find((word) => word.id === selected.wordId).audio });
    } else if (state.phase === 'feedback') {
      cue(state.feedback.correct ? 'correct' : 'wrong');
      later(finishTurn, 700);
    }
  });

  byId('theme').addEventListener('change', () => {
    if (!state || chest === 'opening') return;
    state = core.setTheme(state, byId('theme').value);
    clearEffects();
    render();
    cue('theme', { theme: state.theme });
  });

  byId('chest-button').addEventListener('click', () => {
    if (state.phase !== 'won' || chest !== 'closed') return;
    rewardTheme = state.theme;
    chest = 'opening';
    const season = theme(rewardTheme);
    render();
    stopEffects = GameEffects.play(byId('effects'), season, { reduced: reducedMotion.matches });
    cue('open', { theme: season.id });
    later(() => {
      chest = 'opened';
      setImage(byId('reward-image'), season.symbol);
      byId('reward-label').textContent = `Your ${season.prize}!`;
      byId('reward').hidden = false;
      render();
      byId('reward').focus();
    }, reducedMotion.matches ? 0 : GameEffects.OPEN_MS);
  });

  for (const id of ['win-replay', 'loss-replay']) {
    byId(id).addEventListener('click', () => startRound(true));
  }
  byId('mute').addEventListener('click', () => {
    muted = !muted;
    byId('mute').textContent = muted ? 'Unmute' : 'Mute';
    byId('mute').setAttribute('aria-pressed', String(muted));
    cue('mute', { muted });
  });
  byId('listen').addEventListener('click', () => cue('listen'));
  byId('retry').addEventListener('click', boot);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearEffects();
  });
  reducedMotion.addEventListener('change', () => {
    if (reducedMotion.matches) clearEffects();
  });
  boot();
})();
</script>
<script id="game-audio">
(() => {
  function createController(host, report, themes) {
    const channels = new Map();
    const status = { system: '', voice: '', sfx: '', bgm: '' };
    const labels = { voice: 'Voice', sfx: 'Sound', bgm: 'Music' };
    let currentTheme = null;
    let musicEnabled = true;
    let muted = false;
    let hidden = false;
    let lastVoice = 'assets/audio/voice/welcome.wav';
    let lastSfx = null;
    let context = null;
    let master = null;
    let playbackVersion = 0;

    function notice(kind, message, error) {
      status[kind] = message;
      report(Object.values(status).find(Boolean) || '');
      if (error) host.console.warn(message, error);
    }

    function clearStatus() {
      for (const kind of Object.keys(status)) status[kind] = '';
      report('');
    }

    function ensureContext() {
      if (!context) {
        const Context = host.AudioContext || host.webkitAudioContext;
        if (typeof Context !== 'function') {
          notice('system', 'Audio is not supported on this device.');
          return false;
        }
        context = new Context();
        master = context.createGain();
        master.gain.value = 0.8;
        master.connect(context.destination);
      }
      if (context.state === 'closed') {
        notice('system', 'Audio unavailable. Reload this page.');
        return false;
      }
      if (context.state === 'suspended' || context.state === 'interrupted') {
        const version = playbackVersion;
        context.resume().then(() => {
          if (version !== playbackVersion) return;
          notice('system', context.state === 'running' ? '' : 'Tap Listen to enable audio.');
        }).catch((error) => {
          if (version === playbackVersion) notice('system', 'Tap Listen to enable audio.', error);
        });
      } else {
        notice('system', '');
      }
      return true;
    }

    function duck() {
      const music = channels.get('bgm');
      const voice = channels.get('voice');
      if (!music) return;
      const speaking = voice?.active && !voice.element.paused && !voice.element.error;
      music.gain.gain.setTargetAtTime(speaking ? 0.05 : 0.15, context.currentTime, 0.03);
    }

    function channel(kind) {
      if (channels.has(kind)) return channels.get(kind);
      if (typeof host.Audio !== 'function') {
        notice(kind, 'Audio is not supported on this device.');
        return null;
      }
      const element = new host.Audio();
      element.preload = 'none';
      element.loop = kind === 'bgm';
      // iOS ignores media-element volume changes, so balance channels in the audio graph.
      const input = context.createMediaElementSource(element);
      const gain = context.createGain();
      gain.gain.value = kind === 'voice' ? 0.8 : kind === 'sfx' ? 0.3 : 0.15;
      input.connect(gain);
      gain.connect(master);
      const entry = { element, input, gain, source: '', token: 0, active: false };
      element.addEventListener('error', () => {
        if (entry.active && element.error && !muted && !hidden) {
          notice(kind, `${labels[kind]} unavailable. Tap Listen.`, element.error);
        }
        duck();
      });
      element.addEventListener('ended', () => {
        entry.active = false;
        duck();
      });
      if (kind === 'voice') {
        for (const event of ['playing', 'pause']) element.addEventListener(event, duck);
      }
      channels.set(kind, entry);
      duck();
      return entry;
    }

    function stop(kind) {
      const entry = channels.get(kind);
      if (!entry) return;
      entry.token += 1;
      entry.active = false;
      entry.element.pause();
      if (entry.element.readyState > 0) entry.element.currentTime = 0;
    }

    function stopAll() {
      playbackVersion += 1;
      for (const kind of channels.keys()) stop(kind);
    }

    function play(kind, source) {
      if (!source || muted || hidden) return;
      if (!ensureContext()) return;
      const entry = channel(kind);
      if (!entry) return;
      const element = entry.element;
      if (kind === 'bgm' && entry.source === source && entry.active && !element.paused && !element.error) return;
      stop(kind);
      const token = entry.token;
      if (entry.source !== source) {
        entry.source = source;
        element.src = source;
      } else if (element.error) {
        element.load();
      }
      entry.active = true;
      element.play().then(() => {
        if (token === entry.token) {
          notice(kind, '');
          duck();
        }
      }).catch((error) => {
        if (token !== entry.token) return;
        entry.active = false;
        notice(kind, error.name === 'NotAllowedError' ?
          'Tap Listen to enable audio.' : `${labels[kind]} unavailable. Tap Listen.`, error);
        duck();
      });
    }

    function setTheme(id) {
      if (id === null) {
        currentTheme = null;
        return;
      }
      const found = themes.find((theme) => theme.id === id);
      if (!found) throw new RangeError(`Unknown audio theme: ${id}`);
      currentTheme = found;
    }

    function playCurrent() {
      if (musicEnabled && currentTheme) play('bgm', currentTheme.bgm);
      play('sfx', lastSfx);
      play('voice', lastVoice);
    }

    function prompt(name, sound = name) {
      lastVoice = `assets/audio/voice/${name}.wav`;
      lastSfx = sound ? `assets/audio/sfx/${sound}.wav` : null;
      playCurrent();
    }

    function handle(cue) {
      switch (cue.type) {
        case 'reset':
          stopAll();
          setTheme(cue.theme);
          musicEnabled = true;
          lastVoice = 'assets/audio/voice/welcome.wav';
          lastSfx = null;
          clearStatus();
          return;
        case 'visibility':
          hidden = cue.hidden;
          if (hidden) stopAll();
          return;
        case 'mute':
          muted = cue.muted;
          if (muted) {
            stopAll();
            clearStatus();
          } else {
            playCurrent();
          }
          return;
        case 'theme':
          setTheme(cue.theme);
          stop('bgm');
          prompt(`${cue.theme}-theme`, `${cue.theme}-arrive`);
          return;
        case 'select':
          lastVoice = cue.voice;
          lastSfx = 'assets/audio/sfx/select.wav';
          playCurrent();
          return;
        case 'correct':
        case 'wrong':
          prompt(cue.type);
          return;
        case 'win':
          setTheme(cue.theme);
          musicEnabled = true;
          prompt(`${cue.theme}-arrive`);
          return;
        case 'open':
          prompt(`${cue.theme}-open`);
          return;
        case 'loss':
          musicEnabled = false;
          stop('bgm');
          prompt('loss');
          return;
        case 'listen':
          playCurrent();
          return;
        default:
          throw new RangeError(`Unknown audio cue: ${cue.type}`);
      }
    }

    return Object.freeze({ handle });
  }

  globalThis.GameAudio = Object.freeze({ createController });
})();
</script>
<script id="game-audio-wiring">
(() => {
  const controller = GameAudio.createController(window, (message) => {
    document.getElementById('audio-status').textContent = message;
  }, GameCore.SEASONS);
  window.addEventListener('game:audio', (event) => controller.handle(event.detail));
  document.addEventListener('visibilitychange', () => {
    controller.handle({ type: 'visibility', hidden: document.hidden });
  });
  window.addEventListener('pagehide', () => controller.handle({ type: 'visibility', hidden: true }));
  window.addEventListener('pageshow', () => {
    controller.handle({ type: 'visibility', hidden: document.hidden });
  });
})();
</script>
